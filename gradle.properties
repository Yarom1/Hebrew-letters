org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Only the Robolectric tests use AndroidX (androidx.test); the app itself has no libraries.
android.useAndroidX=true
android.nonTransitiveRClass=true
# The app is kept at Java 8 source level so scripts/build-apk.sh can build it without the SDK.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
